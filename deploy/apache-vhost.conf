# Example Apache vhost. Replace gh-issues.example.com and the certificate paths.
# Requires mod_ssl, mod_proxy, mod_proxy_http and mod_headers.

<VirtualHost *:80>
    ServerName gh-issues.example.com
    Redirect permanent / https://gh-issues.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName gh-issues.example.com

    Protocols h2 http/1.1

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/gh-issues.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/gh-issues.example.com/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyAddHeaders On
    # Only the webhook and the health check are exposed.
    ProxyPass /webhook http://127.0.0.1:3080/webhook
    ProxyPass /health http://127.0.0.1:3080/health
    ProxyPass / !
    RequestHeader set X-Forwarded-Proto "https"

    # GitHub payloads are capped at 25 MB; issue events are far smaller.
    LimitRequestBody 5242880

    <IfModule mod_headers.c>
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header unset Server
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/error-gh-issues.log
    CustomLog ${APACHE_LOG_DIR}/access-gh-issues.log combined
</VirtualHost>
