services:
  issue-notifier:
    # Prebuilt image: `docker compose pull`. From source: `docker compose up -d --build`.
    image: ghcr.io/r-gld/issue-notifier:${IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      CONFIG_PATH: /app/config.yml
      DB_PATH: /app/data/issue-notifier.db
    ports:
      - "127.0.0.1:3080:3000"
    volumes:
      - ./config.yml:/app/config.yml:ro
      - data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
