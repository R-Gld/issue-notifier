# Issue notifier configuration. Secrets live in .env, not here.
# Apply changes with: docker compose restart

kchat:
  # Base URL of the kChat / Mattermost API host, without /api/v4.
  # On kChat this is the team's own host, which may differ from the web UI URL.
  url: https://chat.example.com
  # Default team of the channels, as it appears in channel URLs.
  team: my-team

# Repositories to follow, each posting into one channel. Several repositories may share
# a channel: thread titles then name the repository (gadgets#12).
repos:
  - repo: my-org/my-repo
    channel: github-issues
  # - repo: my-org/other-repo
  #   channel: github-issues        # shared with my-repo
  # - repo: my-org/hardware
  #   channel: hardware-issues
  #   kchatTeam: other-team         # channel of another kChat team
  #   events:                       # overrides the defaults below for this repository
  #     labeled: true

# GitHub login → kChat username (without @).
# Only users listed here can be @mentioned (when they get assigned); others show in bold.
team:
  octocat: octo.cat
  jane-doe-gh: jane.doe

# Which events post a reply in the issue thread (true) or only update the root post (false).
# Defaults for every repository; each one can override them under `events`.
# The root post (status, type, labels, assignees, linked PRs) is always kept up to date.
events:
  assigned: true
  unassigned: true
  commented: true
  pr_linked: true
  pr_merged: true
  pr_closed: true
  closed: true
  reopened: true
  renamed: false
  labeled: false
  unlabeled: false
  typed: false
  milestoned: false
  transferred: false
  deleted: false

comments:
  excerptLength: 300

# Recreates missing threads and refreshes root posts (also runs at startup).
reconcile:
  cron: "0 6 * * *"
  timezone: Europe/Zurich
